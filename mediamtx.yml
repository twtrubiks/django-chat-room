# MediaMTX 設定檔
# 完整預設值參考 https://github.com/bluenviron/mediamtx/blob/main/mediamtx.yml
# 未列出的設定皆使用預設值（RTMP :1935 / HLS :8888 / WebRTC :8889）

# WebRTC 媒體流量走 UDP 8189（docker-compose 需映射 8189/udp）
webrtcLocalUDPAddress: :8189

# 認證委派給 Django（回應 20x 放行、其他拒絕）
# 推流帳密要用 query string（?user=&pass=），URL userinfo 寫法會收到空字串
authMethod: http
authHTTPAddress: http://app:8000/live/auth/

# 播放（read）不設限，直接排除、不委派給 Django，
# 避免 HLS 每個 segment 請求都繞一趟 Django
# 注意：自訂此清單會覆蓋預設值，api / metrics / pprof 必須一併列上
authHTTPExclude:
  - action: api
  - action: metrics
  - action: pprof
  - action: read

# 區網其他裝置要觀看時，需加上主機的區網 IP，
# 否則瀏覽器拿到的 ICE candidate 連不上，例如：
# webrtcAdditionalHosts: [192.168.1.100]

paths:
  all_others:
    # 開播 / 關播時通知 Django（runOnReady 是執行命令，Alpine image 只有 wget 沒有 curl）
    # $MTX_PATH / $LIVE_HOOK_SECRET 由容器內 shell 展開
    runOnReady: wget -q -O- --post-data="path=$MTX_PATH&event=ready&secret=$LIVE_HOOK_SECRET" http://app:8000/live/hook/
    runOnNotReady: wget -q -O- --post-data="path=$MTX_PATH&event=notready&secret=$LIVE_HOOK_SECRET" http://app:8000/live/hook/

services:

    redis:
      container_name: redis
      image: redis
      restart: always
      ports:
        - "6379:6379"
      volumes:
        - redis-data:/data

    app:
      build: .
      command: bash -c "python manage.py runserver 0.0.0.0:8000"
      restart: always
      ports:
        - "8000:8000"
      volumes:
        - .:/django_chat_room
      environment:
        - LIVE_HOOK_SECRET=${LIVE_HOOK_SECRET:-dev-live-hook-secret}
      depends_on:
        - redis

    mediamtx:
      # 注意：必須用 1-ffmpeg（Alpine base，有 sh / wget），
      # 官方 :1 是 scratch-based，runOnReady 會因找不到執行檔而失敗
      container_name: mediamtx
      image: bluenviron/mediamtx:1-ffmpeg
      restart: always
      ports:
        - "1935:1935"     # RTMP 推流
        - "8888:8888"     # HLS 播放
        - "8889:8889"     # WebRTC 播放 / WHIP 推流
        - "8189:8189/udp" # WebRTC ICE（必要）
      environment:
        - LIVE_HOOK_SECRET=${LIVE_HOOK_SECRET:-dev-live-hook-secret}
        # 覆蓋 mediamtx.yml 的 authHTTPAddress，帶上 secret（設定值無法 shell 展開，只能在此組 URL）
        - MTX_AUTHHTTPADDRESS=http://app:8000/live/auth/?secret=${LIVE_HOOK_SECRET:-dev-live-hook-secret}
      volumes:
        - ./mediamtx.yml:/mediamtx.yml

volumes:
    redis-data:
